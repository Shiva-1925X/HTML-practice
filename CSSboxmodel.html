<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 300px;
            min-height: 300px;
            background-color: bisque;
            border: 8px solid brown;
            padding: 40px;
            margin: 30px;
            border-radius: 25px;
            margin: auto;

            font-size: 20px;
            font-style: italic;
            font-weight: 1000;
            font-family: 'Times New Roman', Times, serif;
            
            text-align: center;
            text-align-last: left;
            text-transform: capitalize;
            text-decoration: dotted;
            text-decoration-line: underline;
            text-decoration-color: brown;
            text-decoration-thickness: 3px;
            text-shadow: 1px 1px 1px brown;
            word-spacing: 20px;
            letter-spacing: 2px;
            line-height: 25px;
        
        }
        /* if padding is coded as "padding: 20px 30px 40px 50px" it means that padding is given for each siden in order top, right, bottom, left,  */
        /* if padding is coded as "padding: 20px 30px 40px" it measn that padding is given for top, left/right and bottom */
        /* if padding is coded as "padding: 20px 30px" it means that padding is given for top/bottom and left/right */
    </style>
</head>
<body>
    <div>
        Subject name is CSE326. Lorem ipsum dolor sit, amet consectetur adipisicing elit. Repudiandae facere deserunt debitis dolorem fugit! Nihil tenetur nostrum, velit, dolore cumque dolorum porro explicabo, id eaque saepe tempora neque veritatis? Iusto!
    </div>
</body>
</html>
