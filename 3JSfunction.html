<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function greetings(){
            console.log("Good noon");
        }
        greetings();
        greetings();

        function addition(a, b, c){
            return a+b+c;
        }
        console.log("The sum is "+ addition(4,5,6));

        //ARROW FUNCTION
        const subtraction = (x,y) => {console.log(x-y)};
        subtraction(5,2);

        const greeting = ()=> {console.log("Good noon")};
        greeting()

        //string methods
        const str1 = "Javascript";
        const str2 = "CSE326";
        console.log("We are studying", str1, "in", str2);

        // string template
        console.log(`we are studying ${str1} in ${str2}`);

        console.log(str1.indexOf("v"));
        console.log(str1.charAt(5));
        console.log(str1.length);
        console.log(str1.trim());
        console.log(str1.trim().length);
        console.log(str1.toUpperCase());
        console.log(str1.toLowerCase());
        console.log(str1.includes("x"));
        console.log(str1.slice(2,4));
        console.log(str1.replace("Ja", "Ta"));

        //ARRAY METHODS
        let array1 = ["a", "b", "c", "d"];
        array1.push("grapes"); // at last of the array
        console.log(array1);
        array1.unshift("mango");
        console.log(array1);
        array1.pop(); //delete element form the last
        console.log(array1);
        array1.shift();
        console.log(array1);
        console.log(array1.slice(1,3));

        array1.splice(2,2, "tomato", "potato");
        console.log(array1);

        //objects
        let student = {
            rollno:44,
            course:"cse326",
            name:"Shiva",
            info: function(){
                console.log("The state of the student is Haryana")
            }
        }
        console.log("Roll no",student.rollno, student.name, "is studying",student.course);
        student.info();

        //constructors
        function Book(name, publisher){
            this.name = name;
            this.publisher = publisher;
        }
        const b1 = new Book("Harry potter", "JK rowling");
        console.log(b1.name, b1.publisher);
        const b2 = new Book("DSA", "BPB");
        console.log(b2.name, b2.publisher);

        let marks = 80;
        try{
            if(marks<0 || marks>100){
                throw new Error("Invalid input")
            }
            console.log(marks);
        }
        catch(err){
            console.log(err.message);

        }
        finally{
            console.log("Done");
        }
    </script>
</body>
</html>
